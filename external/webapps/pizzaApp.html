<!DOCTYPE html>
<html lang="en">
<!-- To use 
<interactive iframe="webapps/pizzaApp.html" width="100%" aspect="2.5:1.2"/>
-->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza App</title>

    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .card {
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            border: 3px solid #8AC007;
            padding: 10px;
            transition: background-color 0.4s ease;
            font-size: .9rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button {
            width: 200px;
            padding: 5px;
            border: none;
            border-radius: 12px;
            background: darkgreen;
            color: white;
            cursor: pointer;
        }

        #result {
            padding: 5px;
            border-radius: 12px;
            display: none;
        }

        .field {
            margin-bottom: 8px;
            font-size: .9rem;
        }

        h3 {
            font-size: 1.2rem;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="card">

        <form id="surveyForm">
            <h3>Pizza App 🍕</h3>
            <div class="field">
                <label for="name">Name:</label>
                <input type="text" id="name">
            </div>

            <div class="field">
                <label for="age">Age:</label>
                <input type="number" id="age" min="0" length="3">
            </div>

            <div class="field">
                <label for="favoriteColor">Favorite Color:</label>
                <input type="color" id="favoriteColor" value="#87ceeb">
            </div>

            <div class="field">
                <label>Do you like pizza?</label>

                <span class="radio-group">
                    <label>
                        <input type="radio" name="pizza" value="Yes" checked>
                        Yes
                    </label>

                    <label>
                        <input type="radio" name="pizza" value="No">
                        No
                    </label>
                </span>
            </div>

            <button type="submit">Enter</button>
        </form>

        <div id="result"></div>
    </div>

    <script>
        document.getElementById("surveyForm").addEventListener("submit", function (event) {
            event.preventDefault();

            const name = document.getElementById("name").value;
            const age = document.getElementById("age").value;
            const color = document.getElementById("favoriteColor").value;
            const pizza = document.querySelector('input[name="pizza"]:checked').value;
            const card = document.querySelector(".card");

            // Change page background color
            //document.body.style.backgroundColor = color;
            card.style.backgroundColor = color;

            let pizzaImage = "";

            if (pizza === "Yes") {
                pizzaImage = `
            <div class="pizza-container">
                🍕🍕🍕🍕🍕🍕
            </div>
        `;
            }

            const result = document.getElementById("result");
            result.style.display = "block";

            result.innerHTML = `
        <h3>Hello, ${name}!</h3>
        <strong>You are ${age} years old.</strong>
        <br><strong>Pizza:</strong> ${pizza}        ${pizzaImage}
    `;
        });
    </script>

</body>

</html>
